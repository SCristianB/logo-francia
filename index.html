<style>
/* Presentación sencilla: fondo claro, letra del sistema (la del teléfono), solo números, dos logos por fila. */
:root{

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#121110; --card:#1c1a18; --line:#33302c; --fg:#f2efea; --muted:#a39c94; --accent:#e0718f; --dark:#f2efea; --on-dark:#121110; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#121110; --card:#1c1a18; --line:#33302c; --fg:#f2efea; --muted:#a39c94; --accent:#e0718f; --dark:#f2efea; --on-dark:#121110; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
main{max-width:640px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
header{padding-top:28px;display:flex;flex-direction:column;gap:4px}
.marca{font-size:14px;color:var(--muted)}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0}
.intro{color:var(--muted);margin:0;font-size:15px}
.yo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.yo p{margin:0;flex:1 1 180px;font-size:14px}
.btn{font:600 14px var(--font);min-height:40px;padding:8px 14px;border-radius:6px;border:1px solid var(--dark);background:var(--dark);color:var(--on-dark);cursor:pointer}
.btn.lin{background:transparent;color:var(--fg);border-color:var(--line)}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px;align-items:start}
.op{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.op.sel{border-color:var(--dark);box-shadow:0 0 0 1px var(--dark)}
.op button.zoom{all:unset;cursor:zoom-in;display:block}
.op img{display:block;width:100%;aspect-ratio:1}
.tag{position:absolute;top:8px;left:8px;font:600 12px var(--font);padding:3px 8px;border-radius:4px;background:#fff;color:#1c1a18}
.info{padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
.fila{display:flex;align-items:center;justify-content:space-between}
.num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;padding-left:2px}
.heart{width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px}
.heart svg{fill:none;stroke:currentColor;stroke-width:1.8}
.op.fav .heart{color:var(--accent)}
.op.fav .heart svg{fill:currentColor}
.ver{display:flex;gap:6px}
.sm{flex:1;min-width:0;min-height:40px;font:500 13px var(--font);padding:6px 2px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.pick{min-height:40px;font:600 14px var(--font);padding:6px 10px;border-radius:6px;border:1px solid var(--dark);background:transparent;color:var(--fg);cursor:pointer}
.op.sel .pick{background:var(--dark);color:var(--on-dark)}
.marca-b{min-height:40px;font:600 14px var(--font);padding:6px 4px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.out{min-height:44px;font:600 14px var(--font);padding:6px 10px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.fijo{margin:0;font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{font-size:17px;font-weight:700;margin:0}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qit{display:flex;flex-direction:column;gap:4px}
.qit img{width:100%;aspect-ratio:1;border-radius:6px;display:block;opacity:.55}
.qit button{min-height:40px;font:600 13px var(--font);border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
label{font-size:14px;color:var(--muted)}
textarea{font:15px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:64px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
.what{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{font:600 16px var(--font);min-height:46px;padding:10px 24px;border-radius:6px;border:0;background:var(--dark);color:var(--on-dark);cursor:pointer}
.send:disabled{opacity:.35;cursor:default}
.msg{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;user-select:all}
.copy{align-self:flex-start;font:600 14px var(--font);min-height:40px;padding:8px 14px;border-radius:6px;border:1px solid var(--dark);background:transparent;color:var(--fg);cursor:pointer}
.votes{margin:0;padding-left:18px}.votes li{margin-bottom:6px;font-size:14px}
.lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.94);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:calc(60px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:calc(100vh - 230px);object-fit:contain}
.lbnav{display:flex;align-items:center;gap:14px;color:#fff}
.lbnav b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center}
.flecha{width:44px;height:44px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:600 20px var(--font);cursor:pointer}
.lbtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lt{min-height:40px;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:500 14px var(--font);cursor:pointer}
.lt.on{background:#fff;color:#1c1a18;border-color:#fff}
.lbcolor{display:flex;gap:8px;align-items:center}
.tono{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:500 14px var(--font);cursor:pointer}
.tono i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:inline-block}
.tono.on{border-color:#fff;box-shadow:0 0 0 1px #fff inset}
#lbClose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:600 15px var(--font);min-height:40px;padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<main>

  <section class="yo" id="yo" hidden><p id="yoT"></p><span id="yoB" style="display:flex;gap:8px;flex-wrap:wrap"></span></section>

</main>

</div></div>

let lista=mia||BASE.slice();

function leerLocal(){ try{ const v=JSON.parse(localStorage.getItem('gnbf-lista')||'null'); return Array.isArray(v)&&v.length?v:null; }catch(e){ return null; } }
function leerHash(){ const m=/^#ver-(\d+(?:-\d+)*)$/.exec(location.hash||''); if(!m) return null; return m[1].split('-').map(Number).filter(n=>n>=1&&n<=OPS.length&&!SIEMPRE.includes(n)); }
function ordenar(nums){ return BASE.filter(n=>nums.includes(n)).concat(nums.filter(n=>!BASE.includes(n)).sort((a,b)=>a-b)); }
function puedeEditar(){ return false; }
function guardar(){
  mia=lista.slice();
  try{ localStorage.setItem('gnbf-lista', JSON.stringify(mia)); }catch(e){}
  if(db && isOwner){ db.doc('config/lista').set({nums:mia, fecha:new Date().toISOString()}).catch(()=>{}); }
}
function boton(txt, cls, fn){ const b=document.createElement('button'); b.type='button'; b.className='btn'+(cls?' '+cls:''); b.textContent=txt; b.onclick=fn; return b; }
// visor: el logo, sus versiones (logo, horizontal, nombre, ícono), en la tienda y en productos
const KIT=new Set(BASE.concat(SIEMPRE));
let lbN=null, lbV='logo', tono='orig';
const TONOS=[['orig','Original','linear-gradient(135deg,#d8b45f,#053324)'],['negro','Negro','#141211'],['blanco','Blanco','#ffffff']];
function vistas(n){ return [['logo','Logo']].concat(KIT.has(n)?[['kit','Marca']]:[], [['calle','Tienda'],['prod','Productos']]); }
function abrir(n, v){ lbN=n; lbV=v||'logo'; pintarLb(); $('lb').hidden=false; }
function pintarLb(){
  const suf = tono==='orig' ? '' : '-'+tono;
  $('lbImg').src = lbV==='logo' ? `img/${lbN}${suf}.jpg` : `img/${lbN}-${lbV}${suf}.jpg`;
  const tab=vistas(lbN).find(v=>v[0]===lbV); $('lbImg').alt=`Logo ${lbN} · ${tab?tab[1]:''}`;
  $('lbNum').textContent=lbN;
  const T=$('lbTabs'); T.textContent='';
  vistas(lbN).forEach(([k,t])=>{ const b=document.createElement('button'); b.type='button'; b.className='lt'+(k===lbV?' on':''); b.textContent=t; b.setAttribute('aria-pressed',k===lbV); b.onclick=()=>{ lbV=k; pintarLb(); }; T.appendChild(b); });
  const C=$('lbColor'); C.textContent='';
  TONOS.forEach(([k,t,sw])=>{ const b=document.createElement('button'); b.type='button'; b.className='tono'+(k===tono?' on':''); b.setAttribute('aria-pressed',k===tono);
    const i=document.createElement('i'); i.style.background=sw; b.append(i, t); b.onclick=()=>{ tono=k; pintarLb(); }; C.appendChild(b); });
}
function mover(d){ const o=ordenar(lista).concat(SIEMPRE); const i=o.indexOf(lbN); const n=o[(i+d+o.length)%o.length]; if(!vistas(n).some(v=>v[0]===lbV)) lbV='logo'; lbN=n; pintarLb(); }
$('lbPrev').onclick=()=>mover(-1); $('lbNext').onclick=()=>mover(1);
document.addEventListener('keydown',e=>{ if($('lb').hidden) return; if(e.key==='Escape') $('lb').hidden=true; if(e.key==='ArrowLeft') mover(-1); if(e.key==='ArrowRight') mover(1); });

function render(){
  const L=$('list'); L.textContent='';
  const quitar=modo==='quitar';
  ordenar(lista).concat(SIEMPRE).forEach(n=>{
    const ahora=SIEMPRE.includes(n);
    const a=document.createElement('article');
    a.className='op'+(!quitar&&sel===n?' sel':'')+(!quitar&&favs.has(n)?' fav':'');
    a.innerHTML=`<button class="zoom" type="button" aria-label="Ver el ${n} en grande"><img src="img/${n}.jpg" alt="Logo ${n}" loading="lazy"></button>
      ${ahora?'<span class="tag">El de ahora</span>':''}
      <div class="info"><div class="fila"><span class="num">${n}</span>${quitar?'':`<button class="heart" type="button" aria-pressed="${favs.has(n)}" aria-label="Me gusta el ${n}">${HEART}</button>`}</div>
      ${quitar ? (ahora?'<p class="fijo">Siempre va</p>':'<button class="out" type="button">Quitar</button>')
        : (KIT.has(n)?'<button class="marca-b" type="button">Marca</button>':'')}
      </div>`;
    L.appendChild(a);
    a.querySelector('.zoom').onclick=()=>abrir(n);
    if(quitar){
      const b=a.querySelector('.out');
      if(b) b.onclick=()=>{ lista=lista.filter(x=>x!==n); if(sel===n) sel=null; favs.delete(n); guardar(); pintar(); };
    } else {
      a.querySelector('.heart').onclick=()=>{ favs.has(n)?favs.delete(n):favs.add(n); pintar(); };
      const mb=a.querySelector('.marca-b'); if(mb) mb.onclick=()=>abrir(n,'kit');
    }
  });
  const fuera=BASE.filter(n=>!lista.includes(n)), G=$('qgrid'); G.textContent='';
  $('quitados').hidden=!(quitar && fuera.length);
  fuera.forEach(n=>{
    const d=document.createElement('div'); d.className='qit';
    const im=document.createElement('img'); im.src=`img/${n}.jpg`; im.alt=`Logo ${n}`; im.loading='lazy';
    const b=document.createElement('button'); b.type='button'; b.textContent=`Devolver ${n}`;
    b.onclick=()=>{ lista=lista.concat([n]); guardar(); pintar(); };
    d.append(im,b); G.appendChild(d);
  });
}
function panel(){
  const p=$('yo'), T=$('yoT'), B=$('yoB'); B.textContent='';
  if(porLink){
    p.hidden=true;
    T.textContent='Así lo ve Francia. Para mandárselo: Compartir → copiar link.';
    B.append(boton('Volver','lin',()=>{ location.hash=''; }));
    return;
  }
  p.hidden=!puedeEditar();
  if(modo==='quitar'){ T.textContent='Toca «Quitar» en los que no quieras.'; B.append(boton('Listo','',()=>{ modo='ver'; pintar(); window.scrollTo({top:0}); })); }
  else { T.textContent=`Francia ve ${lista.length} + el de ahora.`; B.append(boton('Quitar logos','',()=>{ modo='quitar'; pintar(); }), boton('Ver como ella','lin',()=>{ location.hash='ver-'+ordenar(lista).join('-'); })); }
}
function bar(){
  const w=$('what'), s=$('send');
  if(modo==='quitar'){ w.textContent=`Quedan ${lista.length} + el de ahora`; s.textContent='Listo'; s.disabled=false; return; }
  s.textContent = s.dataset.saved ? 'Guardar' : 'Enviar';
  if(!favs.size){ w.textContent='Toca ♡ en los que te gusten'; s.disabled=true; return; }
  w.textContent=`Te gustan: ${[...favs].sort((a,b)=>a-b).join(', ')}`;
  s.disabled=false;
}
function pintar(){ render(); panel(); bar(); }
function mensaje(){
  const f=[...favs].sort((a,b)=>a-b);
  return f.length?`Me gustan: ${f.join(', ')}.`:'';
}
$('send').onclick=async()=>{
  if(modo==='quitar'){ modo='ver'; pintar(); window.scrollTo({top:0}); return; }
  $('send').disabled=true; $('send').textContent='Enviando…';
  let saved=false;
  try{ if(db && uid){ await db.doc('votes/'+uid).set({favoritas:[...favs].sort((a,b)=>a-b), fecha:new Date().toISOString()}); saved=true; } }catch(e){ saved=false; }
  $('hecho').hidden=false;
  $('hechoTxt').textContent = saved ? 'Listo, Cris ya lo puede ver.' : 'Esto elegiste:';
  $('msgTxt').textContent=mensaje().trim(); $('copiar').hidden=saved;
  $('waBtn').href='https://wa.me/?text='+encodeURIComponent('Logo Glamour Nails: '+mensaje().trim());
  $('send').dataset.saved='1'; bar();
  $('hecho').scrollIntoView({behavior:'smooth',block:'center'});
};
$('copyBtn').onclick=async()=>{
  try{ await navigator.clipboard.writeText($('msgTxt').textContent); $('copyBtn').textContent='Copiado ✓'; }
  catch(e){ const r=document.createRange(); r.selectNodeContents($('msgTxt')); const g=getSelection(); g.removeAllRanges(); g.addRange(r); $('copyBtn').textContent='Mantén presionado para copiar'; }
};
$('lbClose').onclick=()=>$('lb').hidden=true;
$('lb').onclick=e=>{ if(e.target.id==='lb') $('lb').hidden=true; };
function desdeHash(){
  const h=leerHash();
  if(h && h.length){ porLink=true; lista=h; } else { porLink=false; lista=mia||BASE.slice(); }
  modo='ver';
}
window.addEventListener('hashchange', ()=>{ desdeHash(); pintar(); window.scrollTo({top:0}); });
desdeHash(); pintar();

(async()=>{
  if(!runtime) return;
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    db=d;
    if(u){ isOwner=await u.isOwner(); uid=await u.id(); }
    if(db){
      try{ const c=await db.doc('config/lista').get(); const n=c.exists?((c.data()||{}).nums||[]):[];
        if(Array.isArray(n) && n.length){ mia=n.filter(x=>!SIEMPRE.includes(x)&&x>=1&&x<=OPS.length); if(!porLink) lista=mia.slice(); } }catch(e){}
      if(uid){ try{ const s=await db.doc('votes/'+uid).get(); const v=s.exists?s.data():null;
        if(v){ favs=new Set(v.favoritas||[]); $('send').dataset.saved='1'; } }catch(e){} }
    }
    pintar();
    if(db && isOwner){
      $('votos').hidden=false;
      db.collection('votes').onSnapshot(q=>{
        const ul=$('votosList'); ul.textContent='';
        if(!q.docs.length){ const li=document.createElement('li'); li.textContent='Todavía no hay votos.'; ul.appendChild(li); return; }
        q.docs.forEach(doc=>{ const v=doc.data()||{}; const li=document.createElement('li');
          li.textContent=(v.opcion?`Elegido: ${v.opcion}. `:'')+(v.favoritas&&v.favoritas.length?`Le gustan: ${v.favoritas.join(', ')}. `:'')+(v.comentario?`“${v.comentario}”`:''); ul.appendChild(li); });
      },()=>{});
    }
  }catch(e){}
})();
</script>
