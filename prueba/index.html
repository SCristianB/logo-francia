<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logos · Glamour Nails</title>
<meta name="theme-color" content="#f7f5f2">
<style>
/* Para celular primero: un logo a la vez, botones grandes abajo donde llega el pulgar. */
:root{
  --bg:#f7f5f2; --card:#ffffff; --line:#e4dfd8; --fg:#1c1a18; --muted:#77706a; --accent:#b2385a; --dark:#1c1a18; --on-dark:#ffffff;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#121110; --card:#1c1a18; --line:#33302c; --fg:#f2efea; --muted:#a39c94; --accent:#e0718f; --dark:#f2efea; --on-dark:#121110; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#121110; --card:#1c1a18; --line:#33302c; --fg:#f2efea; --muted:#a39c94; --accent:#e0718f; --dark:#f2efea; --on-dark:#121110; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* arriba: progreso + todos */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.prog{flex:1;display:flex;flex-direction:column;gap:6px}
.prog b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.barra{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--dark);width:0;transition:width .25s}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.lleno{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
/* el logo */
.escena{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);touch-action:pan-y}
.escena img{display:block;width:100%;height:auto;min-height:200px;object-fit:contain;user-select:none;-webkit-user-drag:none}
.num{position:absolute;left:10px;top:10px;min-width:40px;height:32px;padding:0 10px;border-radius:16px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tag{position:absolute;right:10px;top:10px;height:32px;padding:0 12px;border-radius:16px;background:#fff;color:#1c1a18;font-weight:600;font-size:13px;display:grid;place-items:center}
.pista{margin:8px 0 0;text-align:center;font-size:13px;color:var(--muted)}
/* vistas y color */
.seg{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.35}
.tonos{margin-top:10px;display:flex;justify-content:center;gap:10px}
.tonos button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.tonos i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.tonos button[aria-pressed="true"]{border-color:var(--dark);box-shadow:0 0 0 1px var(--dark) inset;font-weight:600}
/* abajo: anterior · me gusta · siguiente */
.acciones{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.acciones .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:64px 1fr 64px;gap:10px}
.flecha{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:26px;cursor:pointer}
.flecha:disabled{opacity:.3}
.gusta{height:64px;border-radius:16px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.gusta svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
.gusta[aria-pressed="true"]{background:var(--accent);color:#fff}
.gusta[aria-pressed="true"] svg{fill:currentColor}
/* todos */
.hoja{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hoja .in{max-width:560px;margin:0 auto}
.hoja header{display:flex;align-items:center;justify-content:space-between;min-height:48px;position:sticky;top:0;background:var(--bg);z-index:1}
.hoja h2{margin:0;font-size:20px}
.cuad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mini{position:relative;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer}
.mini img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.mini span{position:absolute;left:5px;bottom:5px;font-size:13px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:10px}
.mini.si{border-color:var(--accent)}
.mini.si::after{content:'♥';position:absolute;right:5px;top:4px;width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.mini.aqui{outline:3px solid var(--dark);outline-offset:-3px}
/* final */
.fin h2{font-size:24px;margin:16px 0 4px}
.fin p{margin:0 0 14px;color:var(--muted)}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:16px;background:#1f8f4e;color:#fff;font-size:18px;font-weight:700;text-decoration:none;margin-top:16px}
.otra{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;margin-top:10px;cursor:pointer}
.vacio{padding:24px 0;text-align:center;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="prog"><b id="cuenta">1 de 21</b><div class="barra"><i id="barra"></i></div></div>
    <button class="chip" id="verTodos" type="button" aria-label="Ver todos los logos">▦ Todos</button>
    <button class="chip" id="verFin" type="button" hidden>♥ <span id="nFav">0</span></button>
  </div>

  <div class="escena" id="escena">
    <img id="foto" alt="" draggable="false">
    <span class="num" id="num">1</span>
    <span class="tag" id="tag" hidden>El de ahora</span>
  </div>
  <p class="pista" id="pista">Desliza para ver el siguiente</p>

  <div class="seg" id="vistas" role="group" aria-label="Qué ver"></div>
  <div class="tonos" id="tonos" role="group" aria-label="Color"></div>
</div>

<div class="acciones"><div class="in">
  <button class="flecha" id="ant" type="button" aria-label="Anterior">‹</button>
  <button class="gusta" id="gusta" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span id="gustaTxt">Me gusta</span></button>
  <button class="flecha" id="sig" type="button" aria-label="Siguiente">›</button>
</div></div>

<div class="hoja" id="todos" hidden role="dialog" aria-label="Todos los logos"><div class="in">
  <header><h2>Todos</h2><button class="chip" id="cerrarTodos" type="button">Cerrar</button></header>
  <div class="cuad" id="cuad"></div>
</div></div>

<div class="hoja fin" id="fin" hidden role="dialog" aria-label="Tus favoritos"><div class="in">
  <header><h2>Tus favoritos</h2><button class="chip" id="cerrarFin" type="button">Seguir viendo</button></header>
  <p id="finTxt"></p>
  <div class="cuad" id="finCuad"></div>
  <a class="wa" id="wa" href="#" target="_blank" rel="noopener">Mandárselo a Cris por WhatsApp</a>
  <button class="otra" id="otraVez" type="button">Ver todos otra vez</button>
</div></div>

<script>
// Lista que eligió Cris; el de ella (69) va al final.
const LISTA=[1,2,13,17,24,41,49,53,57,58,59,60,61,62,63,64,65,66,67,68,69];
const ELLA=69;
const VISTAS=[['logo','Logo'],['kit','Marca'],['calle','Tienda'],['prod','Productos']];
const TONOS=[['orig','Original','linear-gradient(135deg,#d8b45f,#053324)'],['negro','Negro','#141211'],['blanco','Blanco','#ffffff']];
const $=id=>document.getElementById(id);
let i=0, vista='logo', tono='orig', favs=new Set();
try{ favs=new Set(JSON.parse(localStorage.getItem('gnbf-favs')||'[]').filter(n=>LISTA.includes(n))); }catch(e){}
function guardar(){ try{ localStorage.setItem('gnbf-favs', JSON.stringify([...favs])); }catch(e){} }
function src(n,v,t){ const suf=t==='orig'?'':'-'+t; return v==='logo'?`../img/${n}${suf}.jpg`:`../img/${n}-${v}${suf}.jpg`; }
const VNOM={logo:'',kit:'marca',calle:'en la tienda',prod:'en productos'};

function pintar(){
  const n=LISTA[i];
  $('foto').src=src(n,vista,tono);
  $('foto').alt=`Logo ${n}${VNOM[vista]?' · '+VNOM[vista]:''}`;
  $('num').textContent=n;
  $('tag').hidden = n!==ELLA;
  $('cuenta').textContent=`${i+1} de ${LISTA.length}`;
  $('barra').style.width=((i+1)/LISTA.length*100)+'%';
  $('ant').disabled = i===0;
  $('sig').setAttribute('aria-label', i===LISTA.length-1 ? 'Terminar' : 'Siguiente');
  $('sig').textContent = i===LISTA.length-1 ? '✓' : '›';
  const g=favs.has(n); $('gusta').setAttribute('aria-pressed',g); $('gustaTxt').textContent=g?'Te gusta':'Me gusta';
  $('verFin').hidden=!favs.size; $('nFav').textContent=favs.size; $('verFin').classList.toggle('lleno',favs.size>0);
  $('pista').hidden = i>0;
  const V=$('vistas'); V.textContent='';
  VISTAS.forEach(([k,t])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=t; b.setAttribute('aria-pressed',k===vista); b.onclick=()=>{ vista=k; pintar(); }; V.appendChild(b); });
  const T=$('tonos'); T.textContent='';
  TONOS.forEach(([k,t,sw])=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-pressed',k===tono);
    const c=document.createElement('i'); c.style.background=sw; b.append(c,t); b.onclick=()=>{ tono=k; pintar(); }; T.appendChild(b); });
  // dejar listas las imágenes de al lado
  [LISTA[i+1],LISTA[i-1]].forEach(m=>{ if(m){ const p=new Image(); p.src=src(m,vista,tono); } });
}
function ir(d){
  if(d>0 && i===LISTA.length-1){ abrirFin(); return; }
  i=Math.max(0,Math.min(LISTA.length-1,i+d)); pintar();
}
$('ant').onclick=()=>ir(-1);
$('sig').onclick=()=>ir(1);
$('gusta').onclick=()=>{ const n=LISTA[i]; favs.has(n)?favs.delete(n):favs.add(n); guardar(); pintar(); };

// deslizar con el dedo
let x0=null,y0=null;
$('escena').addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
$('escena').addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) ir(dx<0?1:-1); },{passive:true});
document.addEventListener('keydown',e=>{ if(!$('todos').hidden||!$('fin').hidden){ if(e.key==='Escape'){ $('todos').hidden=true; $('fin').hidden=true; } return; }
  if(e.key==='ArrowRight') ir(1); if(e.key==='ArrowLeft') ir(-1); });

// todos en cuadrícula
function mini(n, onClick){ const b=document.createElement('button'); b.type='button'; b.className='mini'+(favs.has(n)?' si':'')+(n===LISTA[i]?' aqui':'');
  b.setAttribute('aria-label',`Logo ${n}${favs.has(n)?', te gusta':''}`);
  const im=document.createElement('img'); im.src=`../img/${n}.jpg`; im.alt=''; im.loading='lazy';
  const s=document.createElement('span'); s.textContent=n; b.append(im,s); b.onclick=onClick; return b; }
$('verTodos').onclick=()=>{ const C=$('cuad'); C.textContent='';
  LISTA.forEach((n,k)=>C.appendChild(mini(n,()=>{ i=k; $('todos').hidden=true; pintar(); window.scrollTo({top:0}); })));
  $('todos').hidden=false; };
$('cerrarTodos').onclick=()=>$('todos').hidden=true;

// final: favoritos + WhatsApp
function abrirFin(){
  const f=LISTA.filter(n=>favs.has(n)), C=$('finCuad'); C.textContent='';
  if(!f.length){ $('finTxt').textContent='Todavía no marcaste ninguno. Toca ♥ Me gusta en los que te gusten.'; $('wa').hidden=true; }
  else { $('finTxt').textContent=`Te gustaron ${f.length}. Toca uno para verlo otra vez.`; $('wa').hidden=false;
    f.forEach(n=>C.appendChild(mini(n,()=>{ i=LISTA.indexOf(n); $('fin').hidden=true; pintar(); })));
    $('wa').href='https://wa.me/?text='+encodeURIComponent(`Logo Glamour Nails: me gustan ${f.join(', ')}`); }
  $('fin').hidden=false;
}
$('verFin').onclick=abrirFin;
$('cerrarFin').onclick=()=>$('fin').hidden=true;
$('otraVez').onclick=()=>{ $('fin').hidden=true; i=0; pintar(); window.scrollTo({top:0}); };
pintar();
</script>
</body>
</html>
